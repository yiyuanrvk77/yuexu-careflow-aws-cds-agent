<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">约序 CareFlow AWS 系统架构</title>
  <desc id="desc">AWS CDS 消息经过 SNS 和 SQS 进入 Lambda，调用 AgentCore Runtime 和 DynamoDB 工具，再通过 AWS CDS 返回客户。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7a72"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183b2f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="920" fill="#f2f1eb"/>
  <text x="80" y="70" fill="#17211b" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="700">约序 CareFlow · 智能预约运营 Agent</text>
  <text x="82" y="101" fill="#66736b" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16">AWS CDS 负责通信 · AgentCore 负责推理与工具 · DynamoDB 保存权威业务状态</text>

  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <rect x="70" y="170" width="280" height="180" rx="22" fill="#fffefa" stroke="#dbdad2" filter="url(#shadow)"/>
    <text x="96" y="208" fill="#17211b" font-size="18" font-weight="700">客户通信渠道</text>
    <text x="96" y="244" fill="#526059" font-size="15">SMS</text>
    <text x="96" y="276" fill="#526059" font-size="15">RCS</text>
    <text x="96" y="308" fill="#526059" font-size="15">WhatsApp</text>
    <text x="215" y="244" fill="#526059" font-size="15">邮件</text>

    <rect x="430" y="145" width="300" height="230" rx="22" fill="#173b2f" filter="url(#shadow)"/>
    <text x="458" y="185" fill="#d6ef83" font-size="18" font-weight="700">AWS 通信开发者服务</text>
    <text x="458" y="212" fill="#d6ef83" font-size="13" font-weight="700">（Communication Developer Services）</text>
    <text x="458" y="256" fill="#f4f8f5" font-size="15">End User Messaging SMS / RCS</text>
    <text x="458" y="288" fill="#f4f8f5" font-size="15">End User Messaging Social</text>
    <text x="458" y="320" fill="#f4f8f5" font-size="15">Amazon SES</text>
    <text x="458" y="348" fill="#a9c0b5" font-size="13">真实入站事件 + 真实出站 API 调用</text>

    <rect x="810" y="150" width="270" height="220" rx="22" fill="#fffefa" stroke="#dbdad2" filter="url(#shadow)"/>
    <text x="838" y="190" fill="#17211b" font-size="18" font-weight="700">可靠入站链路</text>
    <rect x="838" y="216" width="214" height="44" rx="10" fill="#eaf2ee"/>
    <text x="858" y="244" fill="#315f49" font-size="15">Amazon SNS Topic</text>
    <rect x="838" y="273" width="214" height="44" rx="10" fill="#eaf2ee"/>
    <text x="858" y="301" fill="#315f49" font-size="15">SQS + DLQ</text>
    <text x="838" y="345" fill="#66736b" font-size="13">去重 · 重试 · 渠道事件标准化</text>

    <rect x="1160" y="115" width="365" height="315" rx="24" fill="#e7f1ea" stroke="#b8d2c2" filter="url(#shadow)"/>
    <text x="1188" y="155" fill="#173b2f" font-size="20" font-weight="700">Amazon Bedrock AgentCore</text>
    <rect x="1188" y="180" width="309" height="52" rx="12" fill="#fffefa"/>
    <text x="1210" y="212" fill="#17211b" font-size="16" font-weight="700">Runtime · Strands Agent</text>
    <rect x="1188" y="246" width="146" height="52" rx="12" fill="#fffefa"/>
    <text x="1208" y="278" fill="#17211b" font-size="15">记忆</text>
    <rect x="1351" y="246" width="146" height="52" rx="12" fill="#fffefa"/>
    <text x="1371" y="278" fill="#17211b" font-size="15">可观测性</text>
    <rect x="1188" y="312" width="309" height="90" rx="12" fill="#fffefa"/>
    <text x="1210" y="343" fill="#17211b" font-size="15" font-weight="700">业务工具</text>
    <text x="1210" y="371" fill="#526059" font-size="13">查询预约 · 搜索时段 · 锁定 · 改约</text>
  </g>

  <g stroke="#6a7a72" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M350 258 C380 258 398 258 430 258"/>
    <path d="M730 258 C760 258 778 258 810 258"/>
    <path d="M890 370 C760 470 570 520 480 565"/>
    <path d="M480 610 C720 550 915 450 1160 345"/>
    <path d="M1160 390 C1060 460 945 505 840 540"/>
    <path d="M310 540 C375 475 475 410 548 370"/>
  </g>
  <g fill="#526059" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12">
    <text x="690" y="490">调用 / 流式返回</text>
    <text x="900" y="470">业务工具</text>
    <text x="336" y="470">真实 CDS 发送</text>
    <text x="620" y="442">入站事件</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <rect x="90" y="540" width="390" height="250" rx="22" fill="#fffefa" stroke="#dbdad2" filter="url(#shadow)"/>
    <text x="118" y="580" fill="#17211b" font-size="18" font-weight="700">AWS Lambda 渠道编排</text>
    <text x="118" y="620" fill="#526059" font-size="15">1. 校验 SNS/SQS 事件和客户身份</text>
    <text x="118" y="650" fill="#526059" font-size="15">2. 写入入站消息和幂等记录</text>
    <text x="118" y="680" fill="#526059" font-size="15">3. 使用客户 Session 调用 AgentCore</text>
    <text x="118" y="710" fill="#526059" font-size="15">4. 解析 Agent 流式回复</text>
    <text x="118" y="740" fill="#526059" font-size="15">5. 通过真实 CDS SDK 发送</text>

    <rect x="540" y="540" width="360" height="250" rx="22" fill="#fffefa" stroke="#dbdad2" filter="url(#shadow)"/>
    <text x="568" y="580" fill="#17211b" font-size="18" font-weight="700">Amazon DynamoDB</text>
    <text x="568" y="620" fill="#526059" font-size="15">客户身份映射</text>
    <text x="568" y="650" fill="#526059" font-size="15">预约与版本</text>
    <text x="568" y="680" fill="#526059" font-size="15">时段锁定与预留</text>
    <text x="568" y="710" fill="#526059" font-size="15">会话消息与幂等</text>
    <text x="568" y="740" fill="#526059" font-size="15">候补机会</text>

    <rect x="960" y="540" width="330" height="250" rx="22" fill="#fffefa" stroke="#dbdad2" filter="url(#shadow)"/>
    <text x="988" y="580" fill="#17211b" font-size="18" font-weight="700">业务结果</text>
    <text x="988" y="620" fill="#526059" font-size="15">完成预约改期</text>
    <text x="988" y="650" fill="#526059" font-size="15">原时段进入候补</text>
    <text x="988" y="680" fill="#526059" font-size="15">可审计的工具轨迹</text>
    <text x="988" y="710" fill="#526059" font-size="15">降低前台处理工时</text>
    <text x="988" y="740" fill="#526059" font-size="15">挽回预约收入</text>

    <rect x="1330" y="540" width="200" height="250" rx="22" fill="#d6ef83" filter="url(#shadow)"/>
    <text x="1354" y="580" fill="#173b2f" font-size="18" font-weight="700">评委测试入口</text>
    <text x="1354" y="620" fill="#173b2f" font-size="14">Lambda Function URL</text>
    <text x="1354" y="650" fill="#173b2f" font-size="14">Token + 号码白名单</text>
    <text x="1354" y="680" fill="#173b2f" font-size="14">真实 CDS 发送</text>
    <text x="1354" y="710" fill="#173b2f" font-size="14">Provider Message ID</text>

    <rect x="90" y="835" width="1440" height="48" rx="14" fill="#e7e5dd"/>
    <text x="112" y="865" fill="#526059" font-size="14">可靠性：明确确认 · 条件写入 · 预约版本幂等 · 重试/DLQ · 审计轨迹 · 客户身份隔离工具</text>
  </g>
</svg>
